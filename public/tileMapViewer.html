<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>瓦片地图查看器</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #map {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .control-panel {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      min-width: 260px;
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease;
    }

    .control-panel.collapsed {
      transform: translateX(calc(100% + 12px));
    }

    .panel-toggle-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 999;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      transition: opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
    }

    .panel-toggle-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .panel-toggle-btn:hover {
      background: #e8e8e8;
    }

    .control-panel h3 {
      margin-bottom: 12px;
      font-size: 14px;
      color: #333;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }

    .control-group {
      margin-bottom: 10px;
    }

    .control-group label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .control-group input,
    .control-group select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
    }

    .control-group input:focus,
    .control-group select:focus {
      border-color: #4a90d9;
    }

    .btn {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      margin-top: 6px;
      transition: background 0.2s;
    }

    .btn-primary {
      background: #4a90d9;
      color: #fff;
    }

    .btn-primary:hover {
      background: #357abd;
    }

    .btn-toggle {
      background: #f0f0f0;
      color: #333;
    }

    .btn-toggle:hover {
      background: #e0e0e0;
    }

    .info-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
    }

  </style>
</head>

<body>
  <div id="map"></div>

  <button class="panel-toggle-btn" id="panelToggleBtn" onclick="togglePanel()">&#9664;</button>

  <div class="control-panel" id="panel">
    <h3>瓦片地图配置</h3>

    <div class="control-group">
      <label>瓦片地址模板</label>
      <input type="text" id="tileUrl" value="http://127.0.0.1:5500/public/tiles/{z}/{x}/{y}.png"
        placeholder="{z}/{x}/{y} 为占位符" />
    </div>

    <div class="control-group">
      <label>中心经度</label>
      <input type="number" id="lng" value="82.343824" step="0.001" />
    </div>

    <div class="control-group">
      <label>中心纬度</label>
      <input type="number" id="lat" value="42.999605" step="0.001" />
    </div>

    <div class="control-group">
      <label>初始缩放级别</label>
      <input type="number" id="zoom" value="13" min="1" max="18" />
    </div>

    <div class="control-group">
      <label>最小缩放</label>
      <input type="number" id="minZoom" value="13" min="1" max="18" />
    </div>

    <div class="control-group">
      <label>最大缩放</label>
      <input type="number" id="maxZoom" value="15" min="1" max="18" />
    </div>

    <button class="btn btn-primary" onclick="reloadMap()">重新加载地图</button>
    <button class="btn btn-toggle" onclick="togglePanel()">收起面板</button>
  </div>

  <div class="info-bar" id="infoBar">
    经度: -- | 纬度: -- | 缩放: --
  </div>

  <script>
    var map, tileLayer;

    function initMap() {
      var lng = parseFloat(document.getElementById('lng').value);
      var lat = parseFloat(document.getElementById('lat').value);
      var zoom = parseInt(document.getElementById('zoom').value);
      var minZoom = parseInt(document.getElementById('minZoom').value);
      var maxZoom = parseInt(document.getElementById('maxZoom').value);
      var tileUrl = document.getElementById('tileUrl').value;

      if (map) {
        map.remove();
      }

      map = L.map('map', {
        center: [lat, lng],
        zoom: zoom,
        minZoom: minZoom,
        maxZoom: maxZoom,
        attributionControl: false
      });

      // OSM 底图
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        opacity: 0.3
      }).addTo(map);

      // 自定义瓦片叠加层
      tileLayer = L.tileLayer(tileUrl, {
        minZoom: minZoom,
        maxZoom: maxZoom,
        tileSize: 256,
        errorTileUrl: '',
        opacity: 1
      }).addTo(map);

      updateInfoBar();

      map.on('mousemove', function (e) {
        document.getElementById('infoBar').textContent =
          '经度: ' + e.latlng.lng.toFixed(6) +
          ' | 纬度: ' + e.latlng.lat.toFixed(6) +
          ' | 缩放: ' + map.getZoom();
      });

      map.on('zoomend', updateInfoBar);
    }

    function updateInfoBar() {
      var center = map.getCenter();
      document.getElementById('infoBar').textContent =
        '经度: ' + center.lng.toFixed(6) +
        ' | 纬度: ' + center.lat.toFixed(6) +
        ' | 缩放: ' + map.getZoom();
    }

    function reloadMap() {
      initMap();
    }

    function togglePanel() {
      var panel = document.getElementById('panel');
      var btn = document.getElementById('panelToggleBtn');
      panel.classList.toggle('collapsed');
      btn.classList.toggle('visible');
    }

    initMap();
  </script>
</body>

</html>
