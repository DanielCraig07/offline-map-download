<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>瓦片地图查看器</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #map {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .control-panel {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      min-width: 260px;
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease;
    }

    .control-panel.collapsed {
      transform: translateX(calc(100% + 12px));
    }

    .panel-toggle-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 999;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      transition: opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
    }

    .panel-toggle-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .panel-toggle-btn:hover {
      background: #e8e8e8;
    }

    .control-panel h3 {
      margin-bottom: 12px;
      font-size: 14px;
      color: #333;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }

    .control-group {
      margin-bottom: 10px;
    }

    .control-group label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .control-group input,
    .control-group select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
    }

    .control-group input:focus,
    .control-group select:focus {
      border-color: #4a90d9;
    }

    .btn {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      margin-top: 6px;
      transition: background 0.2s;
    }

    .btn-primary {
      background: #4a90d9;
      color: #fff;
    }

    .btn-primary:hover {
      background: #357abd;
    }

    .btn-toggle {
      background: #f0f0f0;
      color: #333;
    }

    .btn-toggle:hover {
      background: #e0e0e0;
    }

    .info-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <button class="panel-toggle-btn" id="panelToggleBtn" onclick="togglePanel()">&#9664;</button>

  <div class="control-panel" id="panel">
    <h3>瓦片地图配置</h3>

    <div class="control-group">
      <label>瓦片文件夹</label>
      <button class="btn btn-primary" onclick="selectTileFolder()" style="margin-top:0">选择瓦片文件夹</button>
      <div id="folderInfo" style="font-size:11px;color:#999;margin-top:4px">请选择包含 z/y/x.png 结构的文件夹</div>
    </div>

    <div class="control-group">
      <label>路网注记图层（可选）</label>
      <button class="btn btn-toggle" onclick="selectRoadFolder()" style="margin-top:0">选择 tiles-road 文件夹</button>
      <div id="roadFolderInfo" style="font-size:11px;color:#999;margin-top:4px">叠加路网标注，让卫星图显示道路与地名</div>
    </div>

    <div class="control-group">
      <label>中心经度</label>
      <input type="number" id="lng" value="82.343824" step="0.001" />
    </div>

    <div class="control-group">
      <label>中心纬度</label>
      <input type="number" id="lat" value="42.999605" step="0.001" />
    </div>

    <div class="control-group">
      <label>初始缩放级别</label>
      <input type="number" id="zoom" value="11" min="1" max="18" />
    </div>

    <div class="control-group">
      <label>最小缩放</label>
      <input type="number" id="minZoom" value="13" min="1" max="18" />
    </div>

    <div class="control-group">
      <label>最大缩放</label>
      <input type="number" id="maxZoom" value="15" min="1" max="18" />
    </div>

    <button class="btn btn-primary" onclick="reloadMap()">重新加载地图</button>
    <label class="btn btn-toggle" style="display:block;text-align:center;cursor:pointer">
      从README.md加载配置
      <input type="file" id="readmeFile" accept=".md" style="display:none" onchange="loadReadmeFile(event)" />
    </label>
    <button class="btn btn-toggle" onclick="togglePanel()">收起面板</button>
  </div>

  <div class="info-bar" id="infoBar">
    经度: -- | 纬度: -- | 缩放: --
  </div>

  <script>
    var map, tileLayer, roadLayer, tileDirHandle = null, roadDirHandle = null;

    function initMap() {
      var lng = parseFloat(document.getElementById('lng').value);
      var lat = parseFloat(document.getElementById('lat').value);
      var zoom = parseInt(document.getElementById('zoom').value);
      var minZoom = parseInt(document.getElementById('minZoom').value);
      var maxZoom = parseInt(document.getElementById('maxZoom').value);

      if (map) {
        map.remove();
      }

      map = L.map('map', {
        center: [lat, lng],
        zoom: zoom,
        minZoom: minZoom,
        maxZoom: maxZoom,
        attributionControl: false
      });

      if (tileDirHandle) {
        addLocalTileLayer(minZoom, maxZoom);
      }

      updateInfoBar();

      map.on('mousemove', function (e) {
        document.getElementById('infoBar').textContent =
          '经度: ' + e.latlng.lng.toFixed(6) +
          ' | 纬度: ' + e.latlng.lat.toFixed(6) +
          ' | 缩放: ' + map.getZoom();
      });

      map.on('zoomend', updateInfoBar);
    }

    function addLocalTileLayer(minZoom, maxZoom) {
      var LocalTileLayer = L.GridLayer.extend({
        createTile: function (coords, done) {
          var tile = document.createElement('img');
          tile.setAttribute('role', 'presentation');
          tile.style.width = '256px';
          tile.style.height = '256px';
          tile.onerror = function () { tile.style.display = 'none'; };

          var z = coords.z, y = coords.y, x = coords.x;
          tileDirHandle.getDirectoryHandle(String(z))
            .then(function (zDir) { return zDir.getDirectoryHandle(String(y)); })
            .then(function (yDir) { return yDir.getFileHandle(x + '.png'); })
            .then(function (fh) { return fh.getFile(); })
            .then(function (file) {
              tile.src = URL.createObjectURL(file);
              done(null, tile);
            })
            .catch(function () {
              done(null, tile);
            });

          return tile;
        }
      });

      tileLayer = new LocalTileLayer({
        minZoom: minZoom,
        maxZoom: maxZoom,
        tileSize: 256
      }).addTo(map);

      // 加载路网注记图层
      if (roadDirHandle) {
        addRoadLayer(minZoom, maxZoom);
      }
    }

    function addRoadLayer(minZoom, maxZoom) {
      if (roadLayer) { map.removeLayer(roadLayer); roadLayer = null; }
      var RoadTileLayer = L.GridLayer.extend({
        createTile: function (coords, done) {
          var tile = document.createElement('img');
          tile.setAttribute('role', 'presentation');
          tile.style.width = '256px';
          tile.style.height = '256px';
          tile.onerror = function () { tile.style.display = 'none'; };

          var z = coords.z, y = coords.y, x = coords.x;
          roadDirHandle.getDirectoryHandle(String(z))
            .then(function (zDir) { return zDir.getDirectoryHandle(String(y)); })
            .then(function (yDir) { return yDir.getFileHandle(x + '.png'); })
            .then(function (fh) { return fh.getFile(); })
            .then(function (file) {
              tile.src = URL.createObjectURL(file);
              done(null, tile);
            })
            .catch(function () {
              done(null, tile);
            });

          return tile;
        }
      });
      roadLayer = new RoadTileLayer({
        minZoom: minZoom,
        maxZoom: maxZoom,
        tileSize: 256,
        opacity: 1
      }).addTo(map);
    }

    async function selectTileFolder() {
      if (!window.showDirectoryPicker) {
        alert('当前浏览器不支持选择文件夹，请使用 Chrome 或 Edge');
        return;
      }
      try {
        tileDirHandle = await window.showDirectoryPicker({ mode: 'read' });
        roadDirHandle = null;
        document.getElementById('folderInfo').textContent = '已选择: ' + tileDirHandle.name;
        document.getElementById('roadFolderInfo').textContent = '叠加路网标注，让卫星图显示道路与地名';
        showToast('瓦片文件夹已加载');
        var minZoom = parseInt(document.getElementById('minZoom').value);
        var maxZoom = parseInt(document.getElementById('maxZoom').value);
        if (map) {
          if (tileLayer) map.removeLayer(tileLayer);
          if (roadLayer) { map.removeLayer(roadLayer); roadLayer = null; }
          addLocalTileLayer(minZoom, maxZoom);
        } else {
          initMap();
        }
      } catch (e) {
        // user cancelled
      }
    }

    async function selectRoadFolder() {
      if (!window.showDirectoryPicker) {
        alert('当前浏览器不支持选择文件夹，请使用 Chrome 或 Edge');
        return;
      }
      try {
        roadDirHandle = await window.showDirectoryPicker({ mode: 'read' });
        document.getElementById('roadFolderInfo').textContent = '已选择: ' + roadDirHandle.name;
        showToast('路网注记图层已加载');
        var minZoom = parseInt(document.getElementById('minZoom').value);
        var maxZoom = parseInt(document.getElementById('maxZoom').value);
        if (map) {
          addRoadLayer(minZoom, maxZoom);
        }
      } catch (e) {
        // user cancelled
      }
    }

    function updateInfoBar() {
      var center = map.getCenter();
      document.getElementById('infoBar').textContent =
        '经度: ' + center.lng.toFixed(6) +
        ' | 纬度: ' + center.lat.toFixed(6) +
        ' | 缩放: ' + map.getZoom();
    }

    function reloadMap() {
      initMap();
    }

    function togglePanel() {
      var panel = document.getElementById('panel');
      var btn = document.getElementById('panelToggleBtn');
      panel.classList.toggle('collapsed');
      btn.classList.toggle('visible');
    }

    function loadReadmeFile(event) {
      var file = event.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (e) {
        applyReadmeConfig(e.target.result);
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function applyReadmeConfig(text) {
      var centerMatch = text.match(/中心点[:：]\s*([\d.]+),\s*([\d.]+)/);
      var minZoomMatch = text.match(/最小缩放[:：]\s*(\d+)/);
      var maxZoomMatch = text.match(/最大缩放[:：]\s*(\d+)/);
      var hasRoad = /路网注记[:：]\s*true/i.test(text);
      var roadDirMatch = text.match(/路网文件目录[:：]\s*(.+)/);
      if (centerMatch) {
        document.getElementById('lng').value = centerMatch[1];
        document.getElementById('lat').value = centerMatch[2];
      }
      if (minZoomMatch) {
        var minZ = parseInt(minZoomMatch[1]);
        document.getElementById('minZoom').value = minZ;
        document.getElementById('zoom').value = 13;
      }
      if (maxZoomMatch) {
        document.getElementById('maxZoom').value = maxZoomMatch[1];
      }
      initMap();
      showToast('配置已从README.md加载');
      if (hasRoad) {
        // 在面板中显示路网文件目录路径
        var roadPath = roadDirMatch ? roadDirMatch[1].trim() : 'tiles-road/[z]/[y]/[x].png';
        document.getElementById('roadFolderInfo').textContent = '路网文件目录：' + roadPath + '（请点击上方按钮选择 tiles-road 文件夹）';
        setTimeout(function () {
          showToast('检测到路网注记层（' + roadPath + '），请选择 tiles-road 文件夹叠加显示');
        }, 1800);
      }
    }

    function showToast(msg) {
      var toast = document.createElement('div');
      toast.textContent = msg;
      toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;background:rgba(0,0,0,0.75);color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;pointer-events:none;transition:opacity 0.5s';
      document.body.appendChild(toast);
      setTimeout(function () { toast.style.opacity = '0'; }, 2000);
      setTimeout(function () { document.body.removeChild(toast); }, 2500);
    }

    initMap();
  </script>
</body>

</html>
